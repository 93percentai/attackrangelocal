# Ansible Galaxy collections needed by the playbooks in this directory.
#
# Install with:
#   ansible-galaxy collection install -r ansible/requirements.yml
#
# scripts/install-monitoring.sh and scripts/install-extended-attacks.sh
# both run this for you on first invocation, so manual install is only
# needed if you're running a playbook directly.

collections:
  - name: ansible.windows
    version: ">=2.5.0"
  - name: community.windows
    version: ">=2.3.0"
  - name: ansible.posix
    version: ">=1.6.0"
  - name: community.docker
    version: ">=3.13.0"
  - name: community.general
    version: ">=10.0.0"

---
# Adds extra users to Splunk Enterprise on the splunk VM.
#
# Reads either:
#   - SPLUNK_USERS env var:  "user:pw:role[,user:pw:role]..."
#   - ludus/splunk-users.yml (richer schema; see splunk-users.example.yml)
#
# Idempotent: existing users are left alone (no destructive password reset).

- name: Add extra Splunk users
  hosts: "{{ range_id | default(lookup('env','RANGE_ID')) }}-splunk"
  become: true
  gather_facts: false

  vars:
    splunk_admin_password: "{{ lookup('env','SPLUNK_ADMIN_PASSWORD') | default('changeme123!', true) }}"
    splunk_users_env:      "{{ lookup('env','SPLUNK_USERS') | default('', true) }}"
    splunk_users_file:     "{{ playbook_dir }}/../ludus/splunk-users.yml"
    splunk_home: /opt/splunk

  tasks:
    - name: Verify Splunk is installed
      ansible.builtin.stat: { path: "{{ splunk_home }}/bin/splunk" }
      register: splunk_bin
      failed_when: not splunk_bin.stat.exists

    - name: Parse inline SPLUNK_USERS env var (Jinja template)
      ansible.builtin.set_fact:
        users_inline: "{{ users_inline_tmp }}"
      vars:
        users_inline_tmp: >-
          [
            {% for entry in splunk_users_env.split(',') %}
              {% set parts = entry.strip().split(':') %}
              {"name": "{{ parts[0] }}",
               "password": "{{ parts[1] }}",
               "role": "{{ parts[2] if (parts | length) > 2 else 'user' }}"}
              {% if not loop.last %},{% endif %}
            {% endfor %}
          ]
      when: splunk_users_env | length > 0

    - name: Load splunk-users.yml if present
      ansible.builtin.set_fact:
        users_file: "{{ lookup('file', splunk_users_file) | from_yaml }}"
      when: splunk_users_file is exists
      ignore_errors: true

    - name: Merge both sources
      ansible.builtin.set_fact:
        all_users: "{{ (users_inline | default([])) + (users_file | default([])) }}"

    - name: List current Splunk users via REST
      # We use the REST API instead of `splunk list user` because the CLI
      # touches /opt/splunk/var/run/splunk/splunkd.pid, which requires the
      # same uid as splunkd. On real Ludus VMs Splunk runs as root and the
      # CLI works; on container-based deployments (and dockerized splunk)
      # splunkd runs as `splunk` and the CLI from root fails with EACCES.
      # The REST API works in both cases.
      ansible.builtin.uri:
        url: "https://127.0.0.1:8089/services/authentication/users?output_mode=json&count=0"
        user: admin
        password: "{{ splunk_admin_password }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: 200
      register: existing_users_resp
      changed_when: false

    - name: Compute the set of existing usernames
      ansible.builtin.set_fact:
        existing_usernames: "{{ existing_users_resp.json.entry | map(attribute='name') | list }}"

    - name: Create users that don't already exist (via REST API)
      ansible.builtin.uri:
        url: "https://127.0.0.1:8089/services/authentication/users?output_mode=json"
        method: POST
        user: admin
        password: "{{ splunk_admin_password }}"
        force_basic_auth: yes
        validate_certs: no
        body_format: form-urlencoded
        body:
          name: "{{ user.name }}"
          password: "{{ user.password }}"
          roles: "{{ user.role | default('user') }}"
        status_code: [201]
      loop: "{{ all_users }}"
      loop_control:
        loop_var: user
        label: "{{ user.name }} ({{ user.role | default('user') }})"
      when: user.name not in existing_usernames
      no_log: true
      register: user_create

    - name: Report how many users were created
      ansible.builtin.debug:
        msg: >-
          {{ user_create.results
             | default([])
             | selectattr('changed', 'defined')
             | selectattr('changed')
             | list
             | length }} new Splunk users created
          (skipped {{ existing_usernames | length }} pre-existing)

    # Splunk REST-API user creates take effect immediately; no restart
    # needed (unlike conf-file edits).

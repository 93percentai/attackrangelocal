# Default Attack Range template for the local_ludus cloud provider.
#
# VMs are provisioned by Ludus; this template tells Attack Range which hosts
# exist so simulate/API validation can match targets. Connection details come
# from the static /inventory.yml mount (see Patch 3).
#
# scripts/prepare-attack-range-config.sh renders attack-range-config.yml.j2
# into attack_range_fork/upstream/config/${RANGE_ID}.yml with status=running.

general:
  attack_range_password: changeme123!
  cloud_provider: local_ludus
  attack_range_name: attackrangelocal
  ip_whitelist: 0.0.0.0/0
  description: Local Ludus deployment on Proxmox — VMs managed outside Attack Range

# Informational host list. `name` must match the MagicDNS hostname used as the
# simulate target (e.g. 42-winclient1). Patched inventory lookup also accepts
# host names nested under all.children.*.
attack_range:
  - name: dc01
    windows: true
    ip_last_octet: 5
  - name: winclient1
    windows: true
    ip_last_octet: 20
  - name: winsrv1
    windows: true
    ip_last_octet: 21
  - name: splunk
    linux: true
    ip_last_octet: 10
  - name: elastic
    linux: true
    ip_last_octet: 50
  - name: linux
    linux: true
    ip_last_octet: 30
  - name: kali
    linux: true
    ip_last_octet: 40

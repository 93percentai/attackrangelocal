# Default Attack Range template for the local_ludus provider.
#
# Mirrors the AWS "default" template structure so the existing controller
# logic (which iterates the `attack_range:` host list and applies Galaxy
# roles) works unchanged. The actual VM creation is done by Ludus — Attack
# Range only needs this so its UI/API can enumerate "what's in the range".

general:
  provider: local_ludus
  attack_range_name: attackrangelocal
  key_name: not_used
  start_date: not_used
  cleanup: false
  splunk_admin_password: changeme123!
  attack_data_repo: https://github.com/splunk/attack_data

# This stanza is informational only when provider == local_ludus. It tells
# the web UI which hosts to expect. IPs are MagicDNS hostnames; the patched
# ansible_manager reads /inventory.yml for real connection details.
attack_range:
  - hostname: dc01
    role: ar_domain_controller
    ip_address: dc01           # MagicDNS resolves
  - hostname: winclient1
    role: ar_domain_join
    ip_address: winclient1
  - hostname: winsrv1
    role: ar_domain_join
    ip_address: winsrv1
  - hostname: splunk
    role: ar_splunk
    ip_address: splunk
  - hostname: linux
    role: ar_linux
    ip_address: linux
  - hostname: kali
    role: ar_kali
    ip_address: kali
